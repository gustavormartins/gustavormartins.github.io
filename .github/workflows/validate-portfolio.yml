name: Validate static portfolio
on:
  push:
    branches: [main, feature/blohsh-portfolio-2-curadoria]
  pull_request:
    paths:
      - '**/*.html'
      - 'css/**'
      - 'scripts/validate_portfolio.py'
      - '.github/workflows/validate-portfolio.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate pages and internal links
        run: python3 scripts/validate_portfolio.py
