name: Capture BlohshBlast project visuals
on:
  push:
    branches: [feature/blohsh-portfolio-2-curadoria]
    paths:
      - 'scripts/capture_blohsh.mjs'
      - '.github/workflows/capture-project-visuals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout real BlohshBlast source
        run: git clone --depth 1 https://github.com/gustavormartins/blohshblast.github.io.git /tmp/blohshblast
      - name: Install Playwright browser controller
        run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Start game and capture original UI
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/blohshblast
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/blohshblast >/tmp/game-preview.log 2>&1 &
          cd "$GITHUB_WORKSPACE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/capture_blohsh.mjs
          ls -lh project-artifacts/
      - name: Save verified game screenshots in the portfolio branch
        if: success() && github.ref == 'refs/heads/feature/blohsh-portfolio-2-curadoria'
        shell: bash
        run: |
          set -euo pipefail
          test -s project-artifacts/blohshblast-home.png
          test -s project-artifacts/blohshblast-gameplay.png
          mkdir -p assets/projects
          cp project-artifacts/blohshblast-home.png assets/projects/blohshblast-home.png
          cp project-artifacts/blohshblast-gameplay.png assets/projects/blohshblast-gameplay.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects/blohshblast-home.png assets/projects/blohshblast-gameplay.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(portfolio): add authentic BlohshBlast screenshots"
            git push origin HEAD:feature/blohsh-portfolio-2-curadoria
          fi
      - name: Upload genuine screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-blohshblast-screenshots
          path: project-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
