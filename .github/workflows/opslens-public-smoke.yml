name: OpsLens — public Python API smoke
on:
  push:
    branches: [feature/opslens-live-python-api]
    paths:
      - 'scripts/check_opslens_public.py'
      - '.github/workflows/opslens-public-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public Python API health, metrics and safety
        run: python scripts/check_opslens_public.py
