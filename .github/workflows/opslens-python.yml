name: OpsLens — Python API and synthetic security tests
on:
  push:
    branches: [main, feature/opslens-live-python-api]
    paths:
      - 'labs/opslens/**'
      - '.github/workflows/opslens-python.yml'
  pull_request:
    paths:
      - 'labs/opslens/**'
      - '.github/workflows/opslens-python.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: labs/opslens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: labs/opslens/pyproject.toml
      - name: Install original OpsLens plus demo test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run original and public-demo tests
        run: python -m pytest -q
      - name: Verify deployable API import
        run: python -c "from app import app; print(app.title)"
