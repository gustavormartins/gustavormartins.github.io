name: OpsLens Python — synthetic API tests
on:
  push:
    branches: [feature/portfolio-next-motion]
    paths:
      - 'labs/opslens/**'
      - '.github/workflows/opslens-test.yml'
  pull_request:
    paths:
      - 'labs/opslens/**'
      - '.github/workflows/opslens-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/opslens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic MVP
        run: python -m pip install -e '.[test]'
      - name: Validate API with Pytest
        run: python -m pytest -q
